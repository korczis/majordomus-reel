<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #070b16; --muted: #94a3b8; --serif: ui-serif, 'New York', Georgia, serif;
    --sans: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    --grad: linear-gradient(90deg, #a78bfa, #38bdf8 55%, #34d399); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: var(--sans); color: #f1f5f9; -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; }
  .glow { background:
    radial-gradient(900px 800px at 20% 18%, rgba(167,139,250,.30), transparent 62%),
    radial-gradient(900px 900px at 92% 80%, rgba(56,189,248,.22), transparent 62%),
    radial-gradient(700px 600px at 70% 40%, rgba(52,211,153,.12), transparent 62%), var(--bg); }
  .vignette { background: radial-gradient(1100px 1500px at 50% 45%, transparent 50%, rgba(0,0,0,.65)); }
  .scene { position: absolute; inset: 0; }
  .mark-big { position: absolute; left: 230px; top: 330px; width: 620px; height: 620px; overflow: visible;
    filter: drop-shadow(0 0 40px rgba(56,189,248,.6)); }
  .meta { position: absolute; left: 90px; right: 90px; top: 150px; display: flex; justify-content: space-between;
    font-size: 26px; font-weight: 600; letter-spacing: 8px; text-transform: uppercase; color: var(--muted); }
  .rule { position: absolute; left: 90px; right: 90px; height: 2px; background: rgba(226,232,240,.45); }
  .head { position: absolute; left: 90px; right: 90px; top: 1130px; font-family: var(--serif); font-weight: 500;
    font-size: 150px; line-height: .96; letter-spacing: -7px; }
  .head em { font-style: italic; font-weight: 400; background: var(--grad); -webkit-background-clip: text;
    background-clip: text; color: transparent; padding-right: 14px; }
  .foot { top: 1660px; }
</style>
</head>
<body>
<div class="layer glow"></div>
<canvas id="gen" class="layer" width="1080" height="1920"></canvas>
<section class="scene" id="reveal">
  <svg class="mark-big" viewBox="0 0 64 64" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 32h16" stroke="#e2e8f0"/><path d="M32 12 46 52H18Z" stroke="#f8fafc"/>
    <path d="M44 24l16-8" stroke="#a78bfa"/><path d="M46 32h14" stroke="#38bdf8"/><path d="M44 40l16 8" stroke="#34d399"/>
  </svg>
</section>
<div class="meta"><span>The Majordomus Manifesto</span><span>No. 03</span></div>
<div class="rule" style="top: 210px"></div>
<div class="head">Provenance,<br><em>not promises.</em></div>
<div class="rule" style="top: 1600px"></div>
<div class="meta foot"><span>majordomus.dev</span><span>AI agents, supervised</span></div>
<div class="layer vignette"></div>
<script src="gen.js"></script>
<script>
  const scene = document.getElementById('reveal');
  window.genSetup({ scenes: [{ id: 'reveal', el: scene, cue: () => 0 }] });
  window.genRender(3.4, [{ lt: 3.4, opacity: 1 }]);
</script>
</body>
</html>
