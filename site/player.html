  <section id="watch" class="max-w-screen-xl px-4 py-8 mx-auto scroll-mt-20" aria-labelledby="now-title">
    {{watch_heading}}
    <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_22rem]">
      <div class="min-w-0">
        <div id="stage" class="relative mx-auto overflow-hidden bg-black border border-gray-800 rounded-lg">
          <video id="player" class="block w-full h-full" controls playsinline preload="metadata" poster="{{film_poster}}">{{film_sources}}<track kind="captions" srclang="{{media_lang}}" label="{{media_lang_name}}" src="{{film_captions}}"></video>
          <button type="button" id="theater-close" class="absolute hidden top-3 right-3 z-10 px-3 py-1.5 text-xs font-medium text-white bg-gray-900/90 border border-gray-700 rounded-lg hover:bg-gray-800" aria-label="{{m:player.theater_close_label}}">{{m:player.theater_close}}</button>
        </div>
        <p id="stage-note" class="hidden mt-3 {{ui_note}}" role="status"></p>
        <div class="flex flex-wrap items-center justify-between gap-3 mt-4">
          <div class="min-w-0">
            <p class="text-xs font-medium tracking-widest uppercase text-gray-500" id="now-act"{{media_lang_attr}}>{{now_act}}</p>
            <h2 class="text-xl font-semibold truncate" id="now-title"{{media_lang_attr}}>{{now_title}}</h2>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <div class="inline-flex rounded-lg" role="group" aria-label="{{m:player.cut_label}}">{{cut_buttons}}</div>
            <div class="inline-flex rounded-lg" role="group" aria-label="{{m:player.format_label}}">{{format_buttons}}</div>
            <button type="button" id="theater" class="px-3 py-1.5 text-xs font-medium text-gray-300 bg-gray-900 border border-gray-700 rounded-lg hover:bg-gray-800 hover:text-white" title="{{m:player.theater_title}}">{{m:player.theater}}</button>
            <button type="button" id="share" class="px-3 py-1.5 text-xs font-medium text-gray-300 bg-gray-900 border border-gray-700 rounded-lg hover:bg-gray-800 hover:text-white" title="{{m:player.share_title}}">{{m:player.share}}</button>
          </div>
        </div>
        <div class="p-5 mt-4 {{ui_card}}">
          <p class="text-gray-600 dark:text-gray-300 text-pretty" id="now-narration"{{media_lang_attr}}></p>
          <div class="flex flex-wrap gap-2 mt-3" id="now-use-cases"></div>
        </div>
        <p class="hidden mt-3 text-xs text-gray-500 sm:block">{{player_keys}}</p>
      </div>
      <aside class="min-w-0" aria-label="{{m:player.chapters}}">
        <div class="flex items-baseline justify-between mb-2">
          <h2 class="text-sm font-semibold tracking-widest uppercase text-gray-400" id="chapters-title">{{m:player.chapters}}</h2>
          <span class="text-xs text-gray-500" id="chapters-count"></span>
        </div>
        <ol id="chapters"{{media_lang_attr}} class="pe-1 overflow-y-auto max-h-[28rem] lg:max-h-[calc(100vh-9rem)]">
            {{film_chapters}}
        </ol>
      </aside>
    </div>
  </section>
